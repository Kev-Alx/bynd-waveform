# Independent recipe. Paper provides no fine-tuning hyperparameters.
seed: 2026
model:
  checkpoint: artifacts/whisper/small.pt
  language: zh
  nll_reduction: mean
  decoding: {beam_size: 5, temperature: 0.0}
learning_rate: 1.0e-5
weight_decay: 0.01
gradient_accumulation: 8
epochs: 3
max_grad_norm: 1.0

